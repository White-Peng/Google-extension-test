<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Reflection Dashboard</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <h1>Learning Reflection Hub</h1>
        <p>Your recent educational YouTube journeys, summarized and ready to review.</p>
        <div class="hero__actions">
          <button id="refresh" class="button button--primary">Refresh analysis</button>
          <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="button button--ghost">Back to YouTube</a>
        </div>
      </div>
      <div class="hero__status">
        <span id="status-indicator" class="status-indicator"></span>
        <span id="status-text"></span>
      </div>
    </header>

    <main class="layout">
      <section class="panel panel--videos">
        <header>
          <h2>Educational videos</h2>
        </header>
        <ul id="video-list" class="video-list"></ul>
      </section>

      <section class="panel panel--flashcards">
        <header>
          <h2>Flashcards</h2>
        </header>
        <div id="flashcard-list" class="flashcard-grid"></div>
      </section>
    </main>

    <template id="flashcard-template">
      <article class="flashcard" data-state="question">
        <button class="flashcard__toggle" type="button">
          <span class="flashcard__label flashcard__label--question">Show answer</span>
          <span class="flashcard__label flashcard__label--answer">Hide answer</span>
        </button>
        <div class="flashcard__content">
          <h3 class="flashcard__question"></h3>
          <p class="flashcard__answer"></p>
          <a class="flashcard__link" target="_blank" rel="noopener noreferrer">Open video</a>
        </div>
      </article>
    </template>

    <template id="video-item-template">
      <li class="video">
        <a class="video__title" target="_blank" rel="noopener noreferrer"></a>
        <p class="video__summary"></p>
        <div class="video__meta">
          <span class="video__channel"></span>
          <span class="video__duration"></span>
          <span class="video__score"></span>
        </div>
      </li>
    </template>

    <script type="module" src="./index.js"></script>
  </body>
</html>
